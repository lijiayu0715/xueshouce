<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8b2e1f">
<title>学员手册 · 恒韵国乐</title>
<style>
:root{
  --paper:#f6f1e7;
  --card:#fffdf8;
  --ink:#3b2f28;
  --ink-soft:#85746a;
  --line:#e6dac6;
  --zhu:#a0341f;
  --zhu-soft:#f8e9e2;
  --green:#3f7a50;
  --green-soft:#e9f1ea;
  --amber:#9a6b1f;
  --amber-soft:#f8f0dd;
  --blue:#3d5f80;
  --blue-soft:#e8eef4;
  --gold:#b8860b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.65;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:"Kaiti SC","KaiTi","STKaiti","楷体",serif}

/* ===== 顶部 ===== */
header.top{background:linear-gradient(180deg,#8b2e1f,#a0341f);color:#fdf6ec;padding:22px 20px 18px;position:relative}
header.top .school{font-size:12px;letter-spacing:4px;opacity:.85}
header.top h1{font-size:26px;margin-top:2px;font-weight:600}
header.top .updated{position:absolute;right:20px;top:30px;font-size:12px;opacity:.85}
header.top .count{margin-top:8px;font-size:13px;opacity:.9}

/* ===== 搜索与筛选 ===== */
.toolbar{position:sticky;top:0;z-index:10;background:var(--paper);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:9px 14px}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink)}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 14px;border-radius:16px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;user-select:none}
.chip.on{background:var(--zhu);border-color:var(--zhu);color:#fff}

/* ===== 学员列表 ===== */
.list{padding:14px 16px 110px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 3px rgba(59,47,40,.05);transition:transform .1s}
.card:active{transform:scale(.985)}
.card .row1{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--zhu);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-family:"Kaiti SC","KaiTi","STKaiti",serif;flex-shrink:0}
.card .name{font-size:18px;font-weight:600}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft)}
.card .row2{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px;color:var(--ink-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.zai{background:var(--green)}
.dot.xin{background:var(--gold)}
.dot.qing{background:var(--amber)}
.dot.ting{background:#9a8f86}

/* ===== 学员详情 ===== */
.detail{padding:14px 16px 110px;max-width:720px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--zhu);cursor:pointer;padding:4px 0;margin-bottom:10px;user-select:none}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:6px}
.person .pr1{display:flex;align-items:center;gap:12px}
.person .name{font-size:22px;font-weight:600}
.person .st{font-size:13px;color:var(--ink-soft);margin-top:2px}
.person .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pchip{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.person .note{margin-top:12px;font-size:14px;background:var(--zhu-soft);border-left:3px solid var(--zhu);padding:9px 12px;border-radius:0 8px 8px 0}
.fields{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:14px}
.fields .f{display:flex;gap:6px}
.fields .k{color:var(--ink-soft);flex-shrink:0}

/* ===== 日志 ===== */
.section-title{font-size:15px;font-weight:600;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:16px;background:var(--zhu);border-radius:2px}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.log .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.log .date{font-weight:600;font-size:15px}
.badge{font-size:12px;padding:2px 10px;border-radius:10px;background:var(--paper);color:var(--ink-soft)}
.badge.正课{background:var(--zhu-soft);color:var(--zhu)}
.badge.陪练{background:var(--green-soft);color:var(--green)}
.badge.回访{background:var(--amber-soft);color:var(--amber)}
.log .item{display:flex;gap:8px;font-size:14px;margin-top:7px}
.log .ic{flex-shrink:0}
.log .txt{white-space:pre-line}
.log .ic.prog{color:var(--green)}
.log .ic.prob{color:var(--amber)}
.log .ic.home{color:var(--blue)}
.head-right{display:flex;align-items:center;gap:10px}
.logdel,.logedit{font-size:12px;color:#b0a395;cursor:pointer;padding:2px 4px;user-select:none}
.logdel:active,.logedit:active{color:var(--zhu)}
.delstudent{width:100%;background:none;border:1px solid #c0503f;color:#c0503f;border-radius:12px;padding:11px;font-size:14px;margin-top:16px;cursor:pointer}
.log video{width:100%;border-radius:10px;margin-top:10px;background:#000;max-height:340px;display:block}
.upvideo{font-size:12px;color:var(--blue);cursor:pointer;padding:2px 4px;user-select:none}
.upvideo:active{color:var(--zhu)}
.airow{margin-bottom:12px}
.vwrap{margin-top:10px}
.vrow{display:flex;gap:14px;margin-top:6px;font-size:13px}
.vdown{color:var(--blue);text-decoration:none}
.vdel{color:#b0a395;cursor:pointer;user-select:none}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.tcard .tdate{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.tcard video{width:100%;border-radius:10px;background:#000;max-height:340px;display:block}

.empty{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}
footer{text-align:center;font-size:12px;color:#a89a8c;padding:20px 16px 30px}

/* ===== 悬浮按钮 ===== */
.fabs{position:fixed;right:16px;bottom:26px;display:flex;flex-direction:column;gap:10px;z-index:20}
.fab{background:var(--zhu);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:15px;box-shadow:0 3px 10px rgba(160,52,31,.35);cursor:pointer}
.fab.ghost{background:var(--card);color:var(--zhu);border:1px solid var(--zhu);box-shadow:0 2px 8px rgba(59,47,40,.15)}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(40,30,25,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 30px}
.sheet h3{font-size:17px;margin-bottom:14px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.frow input,.frow textarea,.frow select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;background:var(--card);color:var(--ink);font-family:inherit}
.frow textarea{min-height:64px;resize:vertical}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{padding:7px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;user-select:none}
.tchip.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.btn-big{width:100%;background:var(--zhu);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;cursor:pointer;margin-top:6px}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn-big{flex:1}
.btn-big.plain{background:var(--card);color:var(--ink-soft);border:1px solid var(--line)}
.passbox input{letter-spacing:10px;text-align:center;font-size:24px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#3b2f28;color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:82vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>

const FILTERS = ["全部","在读","新报名","请假中","已停课"];

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysAgo(ds){
  const d = new Date(ds + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - d) / 86400000);
  if (diff <= 0) return "今天";
  if (diff === 1) return "昨天";
  if (diff <= 7) return diff + "天前";
  return ds.slice(5).replace("-", ".");
}
function toast(msg, sticky){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._sticky = !!sticky;
  if (!sticky) toast._t = setTimeout(function(){ toastEl.classList.remove("on"); }, 2200);
}
function toastHide(){
  clearTimeout(toast._t);
  toast._sticky = false;
  toastEl.classList.remove("on");
}
function fetchTimeout(url, opts, ms){
  const ctl = new AbortController();
  const t = setTimeout(function(){ ctl.abort(); }, ms);
  opts = opts || {};
  opts.signal = ctl.signal;
  return fetch(url, opts).finally(function(){ clearTimeout(t); });
}
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
async function rpcTextRetry(name, body, times, onTry){
  let lastErr;
  for (let i = 0; i < times; i++){
    if (onTry) onTry(i + 1, times);
    try { return await rpcText(name, body); }
    catch(e){ lastErr = e; await sleep(1500); }
  }
  throw lastErr;
}

/* ============ 数据加载 ============ */
async function loadData(){
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/students?select=id,name,gender,age,piece,note,parent,status,logs(id,date,type,content,progress,problems,homework,video,videos(id,url))", {
      headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + ANON_KEY }
    });
    if (!r.ok) throw new Error("http " + r.status);
    const list = await r.json();
    if (list && list.length) {
      list.forEach(function(s){
        if (s.logs) s.logs.sort(function(a,b){ return a.date.localeCompare(b.date) || (a.id - b.id); });
      });
      state.students = list;
      state.mode = "cloud";
      return;
    }
    if (state.mode !== "cloud") { state.students = JSON.parse(JSON.stringify(FALLBACK.students)); state.mode = "local"; }
  } catch(e) {
    // 网络失败: 若已有云端数据,保留不动(避免"保存后消失");首次加载才用本地兜底
    if (state.mode !== "cloud") { state.students = JSON.parse(JSON.stringify(FALLBACK.students)); state.mode = "local"; }
  }
}

function renderList(){
  const { q, status } = state;
  let list = state.students.filter(function(s){
    if (status !== "全部" && s.status !== status) return false;
    if (q && s.name.indexOf(q) === -1 && (s.note || "").indexOf(q) === -1) return false;
    return true;
  });
  list = list.slice().sort(function(a,b){
    const da = lastLog(a), db = lastLog(b);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db.date.localeCompare(da.date);
  });
  app.innerHTML =
    '<header class="top">' +
      '<div class="school">恒 韵 国 乐</div>' +

    c.onclick = function(){ state.status = c.dataset.st; renderList(); };

mask.addEventListener("click", function(e){ if (e.target === mask) closeSheet(); });

/* ============ 云端写入 ============ */
async function rpc(name, body){
  let r;
  try {
    r = await fetchTimeout(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }, 20000);
  } catch(e) {
    throw new Error("网络连接失败，请检查网络后重试");
  }
  if (!r.ok){
    const t = await r.text();
    if (t.indexOf("bad pass") !== -1) throw new Error("pass");
    throw new Error("保存失败，请稍后再试");
  }
}

      p_pass: TEACHER_PASS, p_student_id: p.sid, p_date: p.date, p_type: p.type,

    loadData().then(render).catch(function(){});
  } catch(e) {
    toast(e.message === "pass" ? "写入失败，请稍后再试" : e.message);

}

/* ============ 视频 ============ */
async function rpcText(name, body){
  let r;
  try {
    r = await fetchTimeout(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "apikey": ANON_KEY, "Authorization": "Bearer " + ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }, 20000);
  } catch(e) {
    throw new Error("网络连接失败，请检查网络后重试");
  }
  if (!r.ok) throw new Error("rpc fail");
  const t = await r.text();
  return JSON.parse(t);
}

function putOnce(url, file, attempt){
  return new Promise(function(resolve, reject){
    toast("上传中 0%…" + (attempt > 1 ? "（自动重传）" : ""), true);
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", url);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.timeout = 900000;
    xhr.upload.onprogress = function(e){
      if (e.lengthComputable){
        toast("上传中 " + Math.round(e.loaded / e.total * 100) + "%…" + (attempt > 1 ? "（自动重传）" : ""), true);
      }
    };
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error("http " + xhr.status));
    };
    xhr.onerror = function(){ reject(new Error("net")); };
    xhr.ontimeout = function(){ reject(new Error("timeout")); };
    xhr.send(file);
  });
}

async function uploadVideo(lid, file){
  const ext = (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4";
  const fname = "v" + Date.now() + "." + ext;
  // 上传期间保持屏幕常亮，防止锁屏中断
  let wake = null;
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) wake = await navigator.wakeLock.request("screen");
  } catch(e){}
  const releaseWake = function(){ if (wake){ try { wake.release(); } catch(e){} } };
  let url;
  try {
    url = await rpcTextRetry("get_put_url", { p_file_name: fname }, 3, function(i, n){
      toast("正在连接云端…（第 " + i + "/" + n + " 次）", true);
    });
  } catch(e){
    toastHide();
    releaseWake();
    toast("第1步失败：连不上云端，请换网络或稍后再试");
    return;
  }
  let upErr = null;
  for (let attempt = 1; attempt <= 2; attempt++){
    try {
      await putOnce(url, file, attempt);
      upErr = null;
      break;
    } catch(e){ upErr = e; }
  }
  if (upErr){
    toastHide();
    releaseWake();
    if (upErr.message === "timeout") toast("第2步失败：上传超时，建议连WiFi或改用1080p拍摄");
    else if (upErr.message === "net") toast("第2步失败：视频上传中断，请保持页面在前台再试，或连WiFi");
    else toast("第2步失败：上传被拒，请重试");
    return;
  }
  toast("上传完成，保存中…", true);
  try {
    let ok = false;
    for (let i = 0; i < 3; i++){
      try {
        await rpc("add_video", { p_pass: TEACHER_PASS, p_log_id: Number(lid), p_url: url.split("?")[0] });
        ok = true;
        break;
      } catch(e){ await sleep(1500); }
    }
    if (!ok) throw new Error("fail");
  } catch(e){
    toastHide();
    releaseWake();
    toast("第3步失败：视频已上传，但保存信息失败，请点「换视频」重传");
    return;
  }
  toastHide();
  releaseWake();
  toast("视频已上传 ✓");
  await loadData();
  render();
}

  }).join("");
  openSheet(
    '<h3>' + (ex ? '✏️ 编辑记录' : '➕ 新增一条记录') + '</h3>' +
    '<div class="airow">' +
      '<button class="btn-big plain" id="aiToggle" style="margin-top:0">🧠 粘贴整段话自动填充</button>' +
      '<div id="aiPanel" style="display:none">' +
        '<div class="frow" style="margin-top:12px"><textarea id="ai_text" style="min-height:88px" placeholder="把整段话粘贴到这里，例如：&#10;彦彤今天练点奏耐力，能坚持3分钟了，重心还是容易往反方向倒，回家继续巩固摇指"></textarea></div>' +
        '<button class="btn-big" id="aiGo">✨ 自动填充</button>' +
      '</div>' +
    '</div>' +
    '<div class="frow"><label>学员</label><select id="f_sid">' + opts + '</select></div>' +
    '<div class="frow"><label>日期</label><input id="f_date" type="date" value="' + (ex ? ex.date : todayStr()) + '"></div>' +
    '<div class="frow"><label>课型</label><div class="tchips" id="f_type">' +
      ["陪练","正课","回访"].map(function(t){ return '<div class="tchip' + (t === (ex ? ex.type : "陪练") ? " on" : "") + '" data-t="' + t + '">' + t + '</div>'; }).join("") +
    '</div></div>' +
    '<div class="frow"><label>📖 教了什么</label><textarea id="f_content" placeholder="今天练了/学了什么">' + esc(ex ? ex.content : "") + '</textarea></div>' +
    '<div class="frow"><label>✅ 进步</label><textarea id="f_progress" placeholder="哪里进步了（可选）">' + esc(ex ? ex.progress : "") + '</textarea></div>' +
    '<div class="frow"><label>⚠️ 问题</label><textarea id="f_problems" placeholder="哪里薄弱（可选）">' + esc(ex ? ex.problems : "") + '</textarea></div>' +
    '<div class="frow"><label>✏️ 作业</label><textarea id="f_homework" placeholder="回家练什么（可选）">' + esc(ex ? ex.homework : "") + '</textarea></div>' +
    '<button class="btn-big" id="f_save">' + (ex ? '保存修改' : '保存') + '</button>');
  let type = ex ? ex.type : "陪练";
  document.getElementById("f_type").querySelectorAll(".tchip").forEach(function(c){
    c.onclick = function(){
      type = c.dataset.t;
      document.getElementById("f_type").querySelectorAll(".tchip").forEach(function(x){ x.classList.toggle("on", x === c); });
    };
  });
  document.getElementById("aiToggle").onclick = function(){
    const p = document.getElementById("aiPanel");
    p.style.display = p.style.display === "none" ? "block" : "none";
  };
  document.getElementById("aiGo").onclick = function(){
    const txt = document.getElementById("ai_text").value.trim();
    if (!txt){ toast("先粘贴一段话"); return; }
    toast("AI 解析中，稍等几秒…");
    const roster = state.students.map(function(s){ return s.name; }).join("、");
    rpcText("ai_parse", { p_pass: TEACHER_PASS, p_text: "学员名单：" + roster + "\n\n老师原话：" + txt }).then(function(resp){
      let d;
      try { d = JSON.parse(resp); } catch(e){ d = null; }
      if (!d || d.error){ toast(d && d.error ? d.error : "AI 解析失败，请重试"); return; }
      if (d.name){
        const hit = state.students.find(function(s){ return s.name === d.name || (d.name && s.name.indexOf(d.name) !== -1); });
        if (hit) document.getElementById("f_sid").value = hit.id;
      }
      if (d.type && ["陪练","正课","回访"].indexOf(d.type) !== -1){
        type = d.type;
        document.getElementById("f_type").querySelectorAll(".tchip").forEach(function(x){ x.classList.toggle("on", x.dataset.t === d.type); });
      }
      if (d.content) document.getElementById("f_content").value = d.content;
      if (d.progress) document.getElementById("f_progress").value = d.progress;
      if (d.problems) document.getElementById("f_problems").value = d.problems;
      if (d.homework) document.getElementById("f_homework").value = d.homework;
      toast("已自动填充，检查一下再点保存 ✓");
    }).catch(function(){ toast("AI 解析失败，请检查网络后重试"); });
  };
  document.getElementById("f_save").onclick = function(){
    const content = document.getElementById("f_content").value.trim();
    if (!content){ toast("「教了什么」至少写一句"); return; }
    const payload = {
      sid: document.getElementById("f_sid").value,
      date: document.getElementById("f_date").value || todayStr(),
      type: type,
      content: content,
      progress: document.getElementById("f_progress").value.trim(),
      problems: document.getElementById("f_problems").value.trim(),
      homework: document.getElementById("f_homework").value.trim()
    };
    if (ex) saveLogEdit(ex.id, payload);
    else saveLog(payload);
  };
}
